<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generous Logo Animation — Exact Replica</title>

<style>
  /* =========================================================================
     EXACT REPLICA of the Generous Branding header-logo animation.
     Source: generousbranding.com  →  site-head.css  +  logo-sprite-30.png

     Technique (verbatim):
       • A single solid-colour block is shaped by a PNG *mask*.
       • The mask is a vertical sprite strip (314 × 3500 px = 50 frames).
       • mask-size: 100% auto  → the strip is one frame wide/tall at a time.
       • Animation = moving mask-position from `0 0` to `0 100%`
         through `steps(49)` over `1.6s`  → 50 discrete frames.
       • Triggered by adding `.is-visible` to `.site-head__logo`.
     ========================================================================= */

  :root{
    --color-white:#ffffff;
    --color-black:#0b0f14;
    /* scaled-up version of their --head-logo (real site: 155px) */
    --head-logo: 520px;
    --transition-duration: .6s;
    --transition-easing: cubic-bezier(0.19, 1, 0.22, 1);
    /* the real sprite from their theme */
    --logo-sprite: url("https://generousbranding.com/wp-content/themes/generous-theme/static/images/logo-sprite-30.png");
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#f2f0ea;               /* light like their header, so the black logo reads */
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3rem; min-height:100vh;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }

  .lab-tag{
    letter-spacing:.4em; text-transform:uppercase; font-size:.66rem; color:#8a8577;
  }

  /* ---- verbatim structure & rules from site-head.css ---- */
  .site-head__logo{
    position:relative; top:0; z-index:3;
    width:var(--head-logo); height:auto;
    transition:top var(--transition-duration) var(--transition-easing);
  }
  .site-head__logo:before{
    display:block; padding-top:20.6451%; content:"";
  }
  .site-head__logo a{ display:block; }

  .site-head__logo__sprite{
    position:absolute;
    top:-3.1255%; left:-0.6452%;
    display:block;
    width:101.2903%; height:106.25%;
    background:var(--color-black);
    -webkit-mask:var(--logo-sprite) 0 0/100% auto no-repeat;
            mask:var(--logo-sprite) 0 0/100% auto no-repeat;
    -webkit-transition:-webkit-mask 1.6s steps(49);
            transition:mask 1.6s steps(49), -webkit-mask 1.6s steps(49);
  }
  /* the trigger — exactly as on the real site */
  .site-head__logo.is-visible .site-head__logo__sprite{
    -webkit-mask-position:0 100%;
            mask-position:0 100%;
  }

  .u-sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .controls{ display:flex; gap:.9rem; }
  button{
    letter-spacing:.15em; text-transform:uppercase; font-size:.75rem;
    color:#0b0f14; background:transparent; border:1px solid #0b0f14;
    padding:.7rem 1.4rem; border-radius:999px; cursor:pointer; transition:.2s;
  }
  button:hover{ background:#0b0f14; color:#f2f0ea; }
</style>
</head>
<body>

<div class="lab-tag">Generous logo · exact replica</div>

<!-- verbatim markup from the real site -->
<div class="site-head__logo js-logo" id="logo">
  <a href="#" onclick="return false">
    <span class="site-head__logo__sprite"></span>
    <span class="u-sr-only">Generous Branding</span>
  </a>
</div>

<div class="controls">
  <button id="replay">Replay</button>
</div>

<script>
  const logo = document.getElementById('logo');

  // Play the sprite reveal by toggling `.is-visible` (exactly like their site).
  function play(){
    logo.classList.remove('is-visible');
    // force reflow so the transition restarts from frame 0
    void logo.offsetWidth;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => logo.classList.add('is-visible'));
    });
  }

  // run once on load
  window.addEventListener('load', play);
  document.getElementById('replay').addEventListener('click', play);
</script>
</body>
</html>
