<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olynta — Logo Animation Lab</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root{
    --ink:#080b10; --line:#22303f;
    --fg:#eef2f6; --fg-dim:#93a1b1; --fg-faint:#5f6f7e;
    --red:#ff4655; --vital:#21f39b; --cyan:#00e5ff;
    --f-display:'Anton',sans-serif; --f-body:'Outfit',sans-serif; --f-mono:'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(0,229,255,.05), transparent 55%),
      radial-gradient(90% 70% at 20% 100%, rgba(255,70,85,.08), transparent 60%),
      var(--ink);
    color:var(--fg); font-family:var(--f-body);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; gap:2.4rem; overflow:hidden;
  }
  .lab-tag{
    font-family:var(--f-mono); letter-spacing:.4em; text-transform:uppercase;
    font-size:.72rem; color:var(--fg-faint);
  }

  /* The word is REAL Anton text (same font as the site), tight like a normal word. */
  .stage{ position:relative; }
  .word{
    font-family:var(--f-display);
    font-size:clamp(3.4rem, 14vw, 10rem);
    line-height:1;
    letter-spacing:.005em;      /* natural word spacing, not spread out */
    color:var(--fg);
    display:inline-flex;
    align-items:flex-end;
    filter:drop-shadow(0 0 14px rgba(0,229,255,.22));
    user-select:none;
    position:relative;
  }
  /* Each letter is a mask window: the glyph "constructs" via a clip reveal.
     Anton's real glyphs are used, so the O is naturally hollow (no inner fill). */
  .ltr{
    display:inline-block;
    position:relative;
    will-change:clip-path;
    contain:paint;
  }
  /* keep the letters kerned like the word "Olynta" */
  .ltr + .ltr{ margin-left:-.01em; }

  /* projectile ball fired from the l */
  .ball{
    position:absolute; top:0; left:0;
    width:.16em; height:.16em; border-radius:50%;
    background:var(--red);
    box-shadow:0 0 14px rgba(255,70,85,.9), 0 0 4px #fff inset;
    opacity:0; pointer-events:none;
    font-size:inherit;
  }

  .controls{ display:flex; gap:.9rem; }
  button{
    font-family:var(--f-mono); letter-spacing:.15em; text-transform:uppercase; font-size:.8rem;
    color:var(--fg); background:transparent; border:1px solid var(--line);
    padding:.7rem 1.4rem; border-radius:999px; cursor:pointer; transition:.2s;
  }
  button:hover{ border-color:var(--red); color:var(--red); }
</style>
</head>
<body>

<div class="lab-tag">Olynta · Animation Lab</div>

<div class="stage">
  <!-- Real Anton text. O capital, "lynta" lowercase → renders as "Olynta". -->
  <div class="word" id="word" aria-label="Olynta">
    <span class="ltr" id="l-o">O</span><span class="ltr" id="l-l">l</span><span class="ltr" id="l-y">y</span><span class="ltr" id="l-n">n</span><span class="ltr" id="l-t">t</span><span class="ltr" id="l-a">a</span>
  </div>
  <span class="ball" id="ball"></span>
</div>

<div class="controls">
  <button id="replay">Replay</button>
</div>

<script>
  const q = s => document.querySelector(s);
  const FRAMES = 30;

  const L = {
    o: q('#l-o'), l: q('#l-l'), y: q('#l-y'),
    n: q('#l-n'), t: q('#l-t'), a: q('#l-a'),
  };
  const word  = q('#word');
  const stage = q('.stage');
  const ball  = q('#ball');

  /* ---- clip-path constructors (p:0 = hidden, p:1 = fully formed) ---- */
  const clip = {
    // O forms from the SOUTH-EAST corner, growing outward in all directions
    seCircle: p => `circle(${(p*160).toFixed(2)}% at 100% 100%)`,
    // reveal upward: bottom of the glyph appears first, builds to the top
    up:       p => `inset(${((1-p)*100).toFixed(2)}% 0% 0% 0%)`,
    // reveal downward: top appears first, builds to the bottom (used to "fill" the y from its dip)
    down:     p => `inset(0% 0% ${((1-p)*100).toFixed(2)}% 0%)`,
  };
  function quantize(progress, frames = FRAMES){
    const step = 1 / frames;
    return Math.max(0, Math.min(1, Math.ceil(progress / step) * step));
  }
  function setClip(el, type, p){
    const c = clip[type](quantize(p));
    el.style.clipPath = c;
    el.style.webkitClipPath = c;
  }
  // add a construction reveal tween to a timeline
  function addReveal(tl, el, type, dur, ease, pos){
    const o = {p:0};
    setClip(el, type, 0);
    tl.to(o, {p:1, duration:dur, ease, onUpdate(){ setClip(el, type, o.p); }}, pos);
  }

  function reset(){
    setClip(L.o, 'seCircle', 0);
    setClip(L.l, 'up', 0);
    setClip(L.n, 'up', 0);
    setClip(L.t, 'up', 0);
    setClip(L.a, 'up', 0);
    // y stays empty until the ball fills it
    setClip(L.y, 'down', 0);
    gsap.set(Object.values(L), {clearProps:'transform', x:0, y:0, scaleY:1});
    gsap.set(ball, {opacity:0, x:0, y:0, scale:1});
  }

  function build(){
    reset();
    const tl = gsap.timeline();

    // 1) O constructs from the south-east, outward
    addReveal(tl, L.o, 'seCircle', 0.75, 'power2.out', 0);

    // 2) l constructs bottom -> top
    addReveal(tl, L.l, 'up', 0.55, 'power2.out', '-=0.10');

    // cannon wind-up: the l vibrates/charges from bottom to top
    tl.set(L.l, {transformOrigin:'50% 100%'});
    tl.to(L.l, {y:-4, duration:.05, yoyo:true, repeat:5, ease:'steps(2)'}, '>')
      .to(L.l, {scaleY:1.05, duration:.10, yoyo:true, repeat:1, ease:'steps(3)'}, '<');

    // 3) the rest of the word constructs (y is intentionally left empty for now)
    addReveal(tl, L.n, 'up', 0.45, 'power2.out', '-=0.05');
    addReveal(tl, L.t, 'up', 0.40, 'power2.out', '-=0.28');
    addReveal(tl, L.a, 'up', 0.45, 'power2.out', '-=0.26');

    // 4) THE SHOT — measure live positions of l (source) and y (target)
    tl.addLabel('shot', '+=0.05');
    tl.call(() => {
      const sr = stage.getBoundingClientRect();
      const lr = L.l.getBoundingClientRect();
      const yr = L.y.getBoundingClientRect();
      const startX = lr.left - sr.left + lr.width * 0.5;
      const startY = lr.top  - sr.top;                 // top of the l
      const endX   = yr.left - sr.left + yr.width * 0.5;
      const endY   = yr.top  - sr.top + yr.height * 0.30; // the y's dip / fork
      ball._startX = startX; ball._startY = startY;
      ball._dx = endX - startX;
      ball._dy = endY - startY;
      // apex height scales with the horizontal hop
      ball._apex = -Math.max(50, Math.abs(ball._dx) * 0.55 + lr.height * 0.35);
      gsap.set(ball, {left:startX, top:startY, xPercent:-50, yPercent:-50, x:0, y:0});
    }, null, 'shot');

    // recoil flash on the l as it fires
    tl.to(L.l, {x:-4, duration:.07, yoyo:true, repeat:1, ease:'steps(2)'}, 'shot');

    // 5) projectile arc: x is linear, y goes up (apex) then down into the y
    tl.to(ball, {opacity:1, duration:.01}, 'shot');
    tl.to(ball, {x:() => ball._dx, duration:.8, ease:'none'}, 'shot');
    tl.to(ball, {y:() => ball._apex, duration:.4, ease:'steps(10)'}, 'shot');
    tl.to(ball, {y:() => ball._dy, duration:.4, ease:'steps(10)'}, 'shot+=0.4');

    // 6) impact — ball drops into the y and the dip fills top -> down
    tl.to(ball, {opacity:0, scale:.35, duration:.16, ease:'power1.in'}, '>-0.02');
    addReveal(tl, L.y, 'down', 0.42, 'back.out(1.5)', '<0.02');

    // 7) final settle glow on the whole word
    tl.fromTo(word,
      {filter:'drop-shadow(0 0 6px rgba(0,229,255,.15))'},
      {filter:'drop-shadow(0 0 24px rgba(0,229,255,.5))', duration:.5, yoyo:true, repeat:1}, '>');

    return tl;
  }

  let master;
  // wait for the Anton font so letter metrics (and the ball target) are correct
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    master = build();
  });

  q('#replay').addEventListener('click', () => {
    if (master) master.kill();
    master = build();
  });
</script>
</body>
</html>
